x-app-environment: &app-environment
  APP_ENV: demo
  DATABASE_URL: postgresql://swipe:swipe@postgres:5432/swipe_demo
  ASYNC_DATABASE_URL: postgresql+asyncpg://swipe:swipe@postgres:5432/swipe_demo
  ALEMBIC_DEV_URL: postgresql://swipe:swipe@postgres:5432/swipe_demo
  ENVIRONMENT: dev
  PYTHONPATH: /app
  MAIN_APP_HOST: 0.0.0.0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PUSH_URL: http://push_app:1026/send_push
  DEMO_STORAGE_DIR: /app/.demo_storage

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  seed:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swipe_demo
      POSTGRES_USER: swipe
      POSTGRES_PASSWORD: swipe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swipe -d swipe_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - swipe_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - swipe_network

  migrate:
    build:
      context: .
      dockerfile: main_app/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *app-environment
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - swipe_network

  seed:
    build:
      context: .
      dockerfile: main_app/Dockerfile
    command: ["python", "-m", "scripts.seed_demo"]
    environment: *app-environment
    env_file:
      - .env
    volumes:
      - demo_storage:/app/.demo_storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - swipe_network

  main_app:
    build:
      context: .
      dockerfile: main_app/Dockerfile
    ports:
      - "1024:1024"
    environment:
      <<: *app-environment
      PYTHONPATH: /opt/swipe:/app
    env_file:
      - .env
    volumes:
      - ./main_app:/app
      - ./common:/app/common
      - ./config.py:/opt/swipe/config.py:ro
      - ./safe_logging.py:/opt/swipe/safe_logging.py:ro
      - demo_storage:/app/.demo_storage
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1024/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - swipe_network

  socket_app:
    build:
      context: .
      dockerfile: socket_app/Dockerfile
    ports:
      - "1025:1025"
    environment:
      <<: *app-environment
      PYTHONPATH: /opt/swipe:/app
    env_file:
      - .env
    volumes:
      - ./socket_app:/app
      - ./common:/app/common
      - ./config.py:/opt/swipe/config.py:ro
      - ./safe_logging.py:/opt/swipe/safe_logging.py:ro
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1025/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - swipe_network

  push_app:
    build:
      context: .
      dockerfile: push_app/Dockerfile
    ports:
      - "1026:1026"
    environment:
      <<: *app-environment
      PYTHONPATH: /opt/swipe:/app
    env_file:
      - .env
    volumes:
      - ./push_app:/app
      - ./common:/app/common
      - ./config.py:/opt/swipe/config.py:ro
      - ./safe_logging.py:/opt/swipe/safe_logging.py:ro
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1026/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - swipe_network

  admin_app:
    build:
      context: .
      dockerfile: admin_app/Dockerfile
    ports:
      - "1027:1027"
    environment:
      <<: *app-environment
      PYTHONPATH: /opt/swipe:/app
    env_file:
      - .env
    volumes:
      - ./admin_app:/app
      - ./common:/app/common
      - ./config.py:/opt/swipe/config.py:ro
      - ./safe_logging.py:/opt/swipe/safe_logging.py:ro
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1027/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - swipe_network

networks:
  swipe_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  demo_storage:
